    "Noether theorem for Killing symmetries": "subsec:noether-killing-symmetries"
    "Mode solutions": "sec:mode-solutions"
    "Temporal gauge": "subsec:temporal-gauge"
    "Dual scalar formalism": "subsec:dual-scalar-field-strength"
    "Equivalence of the two constructions": "subsec:equivalence-two-constructions"
    "Representing the Hamiltonian system with a proper set of variables": "sec:quantization"
    "The framework": "subsec:quantization-framework"
    "Symplectic form": "subsec:symplectic-form"
    "Hamiltonian system": "subsec:hamiltonian-system-discrete"
    "The Noether charges of the Killing symmetries": "subsec:noether-charges-killing"
    "Canonical quantization": "subsec:canonical-quantization"
    "Euclidean correlation function": "sec:euclidean-correlation-function"
    "Euclidean background and modes": "subsec:euclidean-temporal-gauge-modes"
    "Time-ordered mode sum": "subsec:mode-sum"
    "Reduction to a scalar kernel": "subsec:scalar-mode-sum"
    "Application II: The thermal partition function": "sec:thermal-partition-function"
    "Canonical setup": "subsec:canonical-setup"
    "The thermal partition function": "subsec:thermal-partition-function"
    "An analysis of the near-boundary contributions to relevant quantities": "app:falloffs-variational-principle"
    "Gauge fixing and zero modes": "app:gauge-fixing-zero-modes"
    "Reaching temporal gauge": "subsec:app-reaching-temporal-gauge"
    "Residual gauge fixing": "subsec:app-residual-gauge-fixing"
    "Reduction of the equations of motion": "subsec:app-eom-reduction"
    "Static zero modes": "subsec:app-static-modes"
    "Large gauge transformations": "app:large-gauge-transformations"
    "Symplectic normalization of the propagating modes": "app:symplectic-normalization"
    "Evaluation of the symplectic pairing": "app:symplectic-pairing-evaluation"
    "Fixing the normalization constant": "app:fixing-normalization-constant"
  heading_pdf_strings:
    "The Maxwell theory in the global AdS$_3$ spacetime": "The Maxwell theory in the global AdS3 spacetime"
  text_replacements:
