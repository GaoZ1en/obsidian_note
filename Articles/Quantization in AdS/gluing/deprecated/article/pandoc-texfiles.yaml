pandoc:
  from: markdown+wikilinks_title_after_pipe
  to: latex
  wrap: none

postprocess:
  strip_heading_numbers: true
  strip_appendix_prefix: true
  inline_math: dollar
  display_math: align
  compact_blank_lines: true
  heading_labels:
    "Introduction": "sec:introduction"
    "Regional scalar theory, CPS, quantization and interface gluing": "sec:regional-quantum-gluing"
    "Regional scalar theory": "subsec:regional-scalar"
    "CPS and canonical quantization": "subsec:regional-cps-quantization"
    "Interface coupling for quantized regions": "subsec:quantum-interface-coupling"
    "Truncation and boundary-response matching": "subsec:response-matching-general"
    "Gluing two intervals": "sec:two-intervals"
    "Exact analytic benchmark": "subsec:interval-analytic"
    "Quantized regional modes and finite Hamiltonian": "subsec:interval-finite-hamiltonian"
    "Response-matched coupling": "subsec:interval-response-match"
    "Spectrum reconstruction": "subsec:interval-spectrum"
    "Vacuum correlation functions": "subsec:interval-correlators"
    "Cross-interface spacelike covariance": "subsubsec:cross-interface"
    "One-sided interface-to-bulk correlators and sewing residual": "subsubsec:one-sided"
    "Independent joined-theory references and scope": "subsubsec:correlator-references"
    "Conclusion": "sec:conclusion"
    "Four-region gluing": "app:four-regions"
    "Four quadrants and independent edge couplings": "subsec:four-region-edges"
    "Separable Kronecker structure": "subsec:four-region-separable"
    "Nonseparable finite-matrix checks": "subsec:four-region-nonseparable"
    "Global AdS$_2$ gluing benchmark": "app:global-ads2"
    "Continuum response and finite-coupling spectrum": "subsec:ads2-continuum"
    "Regional truncation and response matching": "subsec:ads2-matching"
  heading_pdf_strings:
    "Global AdS$_2$ gluing benchmark": "Global AdS2 gluing benchmark"

fragments:
  - source: "0_abstract.md"
    target: "texfiles/data/abstract.tex"
  - source: "1_introduction.md"
    target: "texfiles/data/introduction.tex"
  - source: "2_regional_quantum_gluing.md"
    target: "texfiles/data/section_1.tex"
  - source: "3_two_intervals.md"
    target: "texfiles/data/section_2.tex"
  - source: "4_conclusion.md"
    target: "texfiles/data/conclusion.tex"
  - source: "appendix_a_four_regions.md"
    target: "texfiles/data/appendix_a.tex"
  - source: "appendix_b_global_ads2.md"
    target: "texfiles/data/appendix_b.tex"
