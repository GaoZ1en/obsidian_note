pandoc:
  from: markdown+wikilinks_title_after_pipe
  to: latex
  wrap: none

postprocess:
  strip_heading_numbers: true
  strip_appendix_prefix: true
  inline_math: dollar
  display_math: align
  compact_blank_lines: true
  heading_labels:
    "Finite-coupling gluing": "sec:gluing-formalism"
    "Interface action and cut equations": "subsec:interface-action"
    "Covariant phase space": "subsec:formalism-cps"
    "Boundary-polarized representation": "subsec:boundary-polarized"
    "Scalar field on a cut interval": "sec:interval-scalar"
    "Action and interface equations": "subsec:interval-action"
    "Finite-coupling modes": "subsec:interval-modes"
    "Endpoint theories": "subsec:interval-endpoints"
    "Scalar gluing in curved and higher-dimensional geometries": "sec:scalar-geometries"
    "Global AdS$_2$": "subsec:global-ads2"
    "Four quadrants of a square": "subsec:four-quadrants"
    "Maxwell theory on a cut cylinder": "sec:maxwell"
    "Gauge-invariant interface action": "subsec:maxwell-interface"
    "CPS reduction and dual scalar": "subsec:maxwell-dual-scalar"
    "Finite-coupling photon modes": "subsec:maxwell-modes"
    "Holonomy sector and the strong-gluing limit": "subsec:maxwell-holonomy"
    "Implementing Dirichlet data": "app:dirichlet"
    "Scalar boundary penalty": "subsec:dirichlet-scalar"
    "Gauge-invariant Maxwell boundary penalty": "subsec:dirichlet-maxwell"
  heading_pdf_strings:
    "Global AdS$_2$": "Global AdS2"
  reference_replacements:
    "Appendix A": 'Appendix~\ref{app:dirichlet}'

fragments:
  - source: "1_gluing_formalism.md"
    target: "texfiles/data/section_1.tex"
  - source: "2_interval_scalar.md"
    target: "texfiles/data/section_2.tex"
  - source: "3_scalar_geometries.md"
    target: "texfiles/data/section_3.tex"
  - source: "4_maxwell.md"
    target: "texfiles/data/section_4.tex"
  - source: "appendix_a_dirichlet.md"
    target: "texfiles/data/appendix_a.tex"
