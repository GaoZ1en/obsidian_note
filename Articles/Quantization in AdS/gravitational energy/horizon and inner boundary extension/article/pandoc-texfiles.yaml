pandoc:
  from: markdown-auto_identifiers+wikilinks_title_after_pipe
  to: latex
  wrap: none
  extra_args:
    - "--shift-heading-level-by=-1"

postprocess:
  strip_heading_numbers: true
  strip_appendix_prefix: true
  inline_math: dollar
  display_math: align
  compact_blank_lines: true
  heading_labels:
    "Introduction": "sec:introduction"
    "Finite-action covariant phase space with an inner boundary": "sec:finite-action-cps"
    "Geometry, action, and orientations": "subsec:geometry-action"
    "Componentwise first variation": "subsec:first-variation"
    "Boundary polarization and slice flux": "subsec:boundary-polarization"
    "Diffeomorphism descent and the Hamiltonian identity": "subsec:diffeomorphism-descent"
    "Perturbative order": "subsec:perturbative-order"
    "Horizon charge, extremal area, and arbitrary gauge": "sec:horizon-identity"
    "The bifurcation-surface charge": "subsec:bifurcation-charge"
    "Moving extremal surfaces": "subsec:moving-extremal-surfaces"
    "Canonical energy and the horizon cocycle": "subsec:horizon-cocycle"
    "Conditional finite-cutoff implication": "subsec:conditional-implication"
    "Moving embeddings: presymplectic geometry and selected polarizations": "sec:moving-boundary"
    "Pulling back the complete action": "subsec:pullback-action"
    "Presymplectic pullback versus Hamiltonian polarization": "subsec:presymplectic-versus-polarization"
    "Wall embedding momentum": "subsec:embedding-momentum"
    "The horizon cocycle as a change of section": "subsec:section-change"
    "Nonuniform compact polarization": "subsec:compact-polarization"
    "Compact and anchored benchmarks": "sec:benchmarks"
    "Compact BTZ calibration": "subsec:btz-benchmark"
    "The AdS-Rindler double cutoff": "subsec:rindler-cutoff"
    "Proper completion and regulator layers": "subsec:proper-completion"
    "A propagating higher-dimensional local-Rindler diagnostic": "subsec:higher-dimensional-diagnostic"
    "The full Brown--Henneaux metric quotient": "sec:brown-henneaux-theorem"
    "Reducibility and the endpoint-fixing section": "subsec:psl-section"
    "The proper Hollands--Wald section": "subsec:hw-section"
    "Linked regulators and slice covariance": "subsec:slice-covariance"
    "Main theorem": "subsec:main-theorem"
    "Positivity and the closed quadratic form": "sec:positivity"
    "Interval variables and the Bañados functional": "subsec:banados-functional"
    "Kernel and positivity": "subsec:kernel-positivity"
    "Form domain and optimal ordinary regularity": "subsec:form-domain"
    "Discussion": "sec:discussion"
    "Finite-action variations and surface descent": "app:finite-action-details"
    "Quadratic area and the Hollands--Wald boundary problem": "app:area-hw"
    "Independence of the ambient extension": "subsec:extension-independence"
    "Uniform regulator estimates": "app:regulator-estimates"
    "Parameterized linked schedules": "subsec:parameterized-schedules"
    "Explicit member and regulator independence": "subsec:regulator-independence"
    "Convention map and computational checks": "app:checks"
    "A propagating higher-dimensional local-Rindler test": "app:higher-dimensional-rindler"
    "Einstein--GHY collar and radiative mode": "subsec:rindler-radiative-mode"
    "Complete wall variation": "subsec:rindler-wall-variation"
    "Two inequivalent horizon limits": "subsec:rindler-horizon-limits"

fragments:
  - source: "0_introduction.md"
    target: "texfiles/data/introduction.tex"
  - source: "1_finite_action_cps.md"
    target: "texfiles/data/section_1.tex"
  - source: "2_horizon_identity.md"
    target: "texfiles/data/section_2.tex"
  - source: "3_moving_boundary.md"
    target: "texfiles/data/section_3.tex"
  - source: "4_benchmarks.md"
    target: "texfiles/data/section_4.tex"
  - source: "5_brown_henneaux_theorem.md"
    target: "texfiles/data/section_5.tex"
  - source: "6_positivity.md"
    target: "texfiles/data/section_6.tex"
  - source: "7_conclusion.md"
    target: "texfiles/data/conclusion.tex"
  - source: "a_finite_action_details.md"
    target: "texfiles/data/appendix_a.tex"
  - source: "b_area_and_hw.md"
    target: "texfiles/data/appendix_b.tex"
  - source: "c_regulator_estimates.md"
    target: "texfiles/data/appendix_c.tex"
  - source: "d_conventions_and_checks.md"
    target: "texfiles/data/appendix_d.tex"
  - source: "e_higher_dimensional_rindler.md"
    target: "texfiles/data/appendix_e.tex"
