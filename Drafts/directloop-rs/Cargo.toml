[package]
name = "directloop"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Exact loop/SDE/trace enumeration corresponding to directloopTest1"
publish = false

[dependencies]
num-bigint = { version = "0.4.6", features = ["serde"] }
num-integer = "0.1.46"
num-traits = "0.2.19"
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
strip = "none"
